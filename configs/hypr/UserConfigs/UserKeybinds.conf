# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# /* ---- 🌟 Caelestia Shell Keybinds 🌟 ---- */
unbind = $mainMod, SUPER_L
unbind = $mainMod, SPACE
unbind = $mainMod, Space
unbind = $mainMod, N
unbind = $mainMod, M
unbind = $mainMod, B
unbind = $mainMod, D

bindd = $mainMod, Space, Caelestia Launcher, exec, caelestia launcher
bindd = $mainMod, D, Caelestia Launcher, exec, caelestia launcher
bindd = $mainMod, N, Notifications Sidebar, exec, caelestia toggle sidebar
bindd = $mainMod, C, Quick Settings Control Center, exec, caelestia toggle utilities
bindd = $mainMod SHIFT, N, Caelestia Nexus Settings, exec, caelestia nexus
bindd = $mainMod, Tab, Caelestia Dashboard, exec, caelestia dashboard
bindd = $mainMod, Escape, Caelestia Session Menu, exec, caelestia session
bindd = $mainMod, H, Search Keybinds & Shortcuts, exec, $scriptsDir/KeyBinds.sh

# Open Caelestia-themed Firefox (Super+B)
bindd = $mainMod, B, Open Firefox Browser, exec, $scriptsDir/Firefox.sh
bindd = $mainMod, V, Clipboard Manager, exec, $UserScripts/ClipboardManager.sh

# Dynamic Accent Switcher (Blue / Red)
bindd = $mainMod ALT, A, Toggle Accent Color, exec, $HOME/.config/hypr/scripts/SetAccent.sh toggle
bindd = $mainMod SHIFT, A, Accent Color Menu, exec, $HOME/.config/hypr/scripts/SetAccent.sh menu

# Frosty Settings Control Center (Super+I or Super+,)
unbind = $mainMod, I
bindd = $mainMod, I, Frosty Settings, exec, caelestia nexus frosty
bindd = $mainMod, comma, Frosty Settings, exec, caelestia nexus frosty

# Window Management (Tiling & Floating)
bindd = $mainMod SHIFT, Space, Toggle Floating, togglefloating,
bindd = $mainMod, F, Toggle Fullscreen, fullscreen, 0
bindd = $mainMod, J, Toggle Split Direction, layoutmsg, togglesplit

# Media Controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
bindd = $mainMod, M, Now Playing Info, exec, $scriptsDir/MediaControls.sh
