# /* ---- 💫 iOS Liquid Glass / Organic Spring Animations 💫 ---- */ #

animations {
  enabled = yes

  # ─── Organic Fluid Spring Beziers ───
  # Fluid Spring: smooth organic expansion with gentle rubber-band settle
  bezier = fluidSpring, 0.16, 1.12, 0.3, 1.02
  # Viscous Move: soft elastic damping for neighboring tiled windows
  bezier = fluidMove, 0.2, 1.05, 0.32, 1.0
  # Smooth Out: natural liquid collapse on close
  bezier = smoothOut, 0.35, 0.0, 0.2, 1.0
  # Smooth In: gentle fade-in
  bezier = smoothIn, 0.1, 0.9, 0.2, 1.0

  # ─── Window Lifecycle Animations ───
  # Windows blooming open: soft organic spring bloom from 78% scale
  animation = windowsIn, 1, 5, fluidSpring, popin 78%
  # Windows closing: gentle elastic collapse into blur
  animation = windowsOut, 1, 4, smoothOut, popin 82%
  # Neighbor windows re-tiling: fluid cushion adjustment
  animation = windowsMove, 1, 5, fluidMove
  # Base fallback
  animation = windows, 1, 5, fluidSpring, popin 78%

  # ─── Fades, Layers & Workspaces ───
  animation = fade, 1, 4, smoothIn
  animation = fadeIn, 1, 4, smoothIn
  animation = fadeOut, 1, 3, smoothOut
  animation = layers, 1, 5, fluidSpring, popin 80%
  animation = layersIn, 1, 5, fluidSpring, popin 80%
  animation = layersOut, 1, 4, smoothOut, popin 85%
  animation = workspaces, 1, 5, fluidSpring, slide
  animation = workspacesIn, 1, 5, fluidSpring, slide
  animation = workspacesOut, 1, 5, smoothOut, slide
}