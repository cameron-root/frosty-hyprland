# /* ---- 💫 Caelestia Amoeba / Mitosis Organic Fluid Animations 💫 ---- */ #

animations {
  enabled = yes

  # ─── Organic Cellular / Fluid Beziers ───
  # Mitosis Bloom: rapid cell bud expansion with organic rubber-band overshoot
  bezier = amoebaBloom, 0.18, 1.18, 0.28, 1.02
  # Mitosis Snap: viscous fluid settling for re-tiling / moving neighbor windows
  bezier = amoebaSnap, 0.22, 1.12, 0.36, 1.0
  # Cell Absorption: surface-tension contraction upon window close
  bezier = amoebaAbsorb, 0.35, -0.2, 0.15, 1.0
  # Smooth viscous easing for fades and layers
  bezier = fluid, 0.1, 0.9, 0.2, 1.0

  # ─── Window Lifecycle Animations ───
  # Windows budding open: pop out from 12% scale with cell bloom overshoot
  animation = windowsIn, 1, 5, amoebaBloom, popin 12%
  # Windows closing: implode back into a droplet before disappearing
  animation = windowsOut, 1, 4, amoebaAbsorb, popin 20%
  # Neighbor windows re-tiling: squish and adjust fluidly to accommodate the new cell
  animation = windowsMove, 1, 5, amoebaSnap
  # Base fallback
  animation = windows, 1, 5, amoebaBloom, popin 12%

  # ─── Fades, Layers & Borders ───
  animation = fade, 1, 4, fluid
  animation = fadeIn, 1, 4, fluid
  animation = fadeOut, 1, 3, amoebaAbsorb
  animation = layers, 1, 5, amoebaBloom, popin 70%
  animation = layersIn, 1, 5, amoebaBloom, popin 70%
  animation = layersOut, 1, 4, amoebaAbsorb, popin 80%

  # ─── Workspaces ───
  animation = workspaces, 1, 5, amoebaSnap, slide
  animation = workspacesIn, 1, 5, amoebaSnap, slide
  animation = workspacesOut, 1, 5, amoebaAbsorb, slide
}