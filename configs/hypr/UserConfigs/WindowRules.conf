# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Caelestia Shell Layer Rules (Frosted Glass & Blur)
layerrule = match:namespace caelestia-drawers, blur on
layerrule = match:namespace caelestia-drawers, ignore_alpha 0.1
layerrule = match:namespace caelestia-border-exclusion, blur on
layerrule = match:namespace quickshell, blur on
layerrule = match:namespace quickshell, ignore_alpha 0.1

# Rofi & Notifications Frosted Glass Blur
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0.1
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.1
layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.1

# Firefox Frosted Glass Window Rules
windowrule = match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$, opacity 0.96 0.90
windowrule = match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$, rounding 18
# Thunar File Manager Frosted Glass Rules
windowrule = match:class ^([Tt]hunar)$, opacity 0.94 0.86
windowrule = match:class ^([Tt]hunar)$, rounding 18

# Frosty Settings Control Center Rules
windowrule = match:class ^(io.caelestia.frosty_settings)$, opacity 0.95 0.88
windowrule = match:class ^(io.caelestia.frosty_settings)$, rounding 22
windowrule = match:class ^(io.caelestia.frosty_settings)$, float on
windowrule = match:class ^(io.caelestia.frosty_settings)$, size 880 700
windowrule = match:class ^(io.caelestia.frosty_settings)$, center on

# Nautilus File Manager (GNOME Files) Frosted Glass Rules
windowrule = match:class ^(org\.gnome\.Nautilus|[Nn]autilus)$, opacity 0.94 0.86
windowrule = match:class ^(org\.gnome\.Nautilus|[Nn]autilus)$, rounding 20

