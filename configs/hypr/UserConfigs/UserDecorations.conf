# /* ---- 💫 iOS Frosted Glass & Bubble Decor Settings 💫 ---- */ #
# Decoration Settings for iOS Liquid Glass Aesthetic

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
source = $HOME/.config/hypr/UserConfigs/Accent.conf

general {
  border_size = 1
  gaps_in = 6
  gaps_out = 8

  # Dynamic specular glass rim borders with accent glow
  col.active_border = $accent_active
  col.inactive_border = rgba(ffffff12)
}

decoration {
  rounding = 26
  
  active_opacity = 0.94
  inactive_opacity = 0.85
  fullscreen_opacity = 0.98

  dim_inactive = true
  dim_strength = 0.08
  dim_special = 0.6

  # Diffused ambient drop shadow elevating glass bubbles
  shadow {
    enabled = true
    range = 28
    render_power = 4
    color = rgba(00000050)
    color_inactive = rgba(00000028)
  }

  # Multi-pass vibrant frosted glass blur (refined -15% blur for crisp clarity)
  blur {
    enabled = true
    size = 1
    passes = 3
    vibrancy = 0.24
    vibrancy_darkness = 0.08
    contrast = 1.06
    brightness = 1.02
    noise = 0.012
    new_optimizations = true
    ignore_opacity = true
    special = true
    popups = true
    popups_ignorealpha = 0.1
  }
}

group {
  col.border_active = rgba(ffffff40)

  groupbar {
    col.active = rgba(ffffff33)
  }
}
