# /* ---- 💫 iOS Frosted Glass Hyprlock ---- */
# Aesthetic: blurred wallpaper + floating minimal clock + frosted glass password card
# Font: JetBrains Mono Nerd Font | Accent: rgba(255,255,255,0.18) borders

# Sourcing wallust colors
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    fractional_scaling = 2
    immediate_render    = true
    # no grace — lock immediately
}

# ──────────────────────────────────────────────────────
# BACKGROUND — heavy frosted blur over current wallpaper
# ──────────────────────────────────────────────────────
background {
    monitor    =
    path       = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current

    color      = rgb(0, 0, 0)   # fallback until path loads

    blur_size        = 7
    blur_passes      = 3
    noise            = 0.015
    contrast         = 1.1
    brightness       = 0.85
    vibrancy         = 0.25
    vibrancy_darkness = 0.0
}

# ──────────────────────────────────────────────────────
# CLOCK — ultra-light, dead-center
# ──────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +'%H:%M')"
    color       = rgba(255, 255, 255, 0.92)
    font_size   = 160
    font_family = JetBrainsMono Nerd Font Thin
    position    = 0, 120
    halign      = center
    valign      = center
}

# ──────────────────────────────────────────────────────
# DATE — below clock, Victor Mono Bold Italic
# ──────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:18000000] echo "$(date +'%A, %-d %B')"
    color       = rgba(255, 255, 255, 0.70)
    font_size   = 24
    font_family = Victor Mono Bold Italic
    position    = 0, 30
    halign      = center
    valign      = center
}

# ──────────────────────────────────────────────────────
# USERNAME — above input field
# ──────────────────────────────────────────────────────
label {
    monitor     =
    text        =   $USER
    color       = rgba(255, 255, 255, 0.55)
    font_size   = 20
    font_family = JetBrains Mono Nerd Font
    position    = 0, 196
    halign      = center
    valign      = bottom
}

# ──────────────────────────────────────────────────────
# INPUT FIELD — frosted glass card at bottom-center
# ──────────────────────────────────────────────────────
input-field {
    monitor           =
    size              = 380, 72
    outline_thickness = 1
    rounding          = 12

    dots_size         = 0.28
    dots_spacing      = 0.25
    dots_center       = true

    outer_color       = rgba(255, 255, 255, 0.18)
    inner_color       = rgba(13, 16, 24, 0.75)
    font_color        = rgba(255, 255, 255, 0.90)
    capslock_color    = rgba(255, 200, 100, 0.90)

    fade_on_empty     = true
    font_family       = JetBrains Mono Nerd Font
    placeholder_text  = <i><span foreground="##ffffff80">🔒  Enter Password</span></i>
    hide_input        = false

    position          = 0, 120
    halign            = center
    valign            = bottom
}

# ──────────────────────────────────────────────────────
# KEYBOARD LAYOUT — beneath input field
# ──────────────────────────────────────────────────────
label {
    monitor     =
    text        = $LAYOUT
    color       = rgba(255, 255, 255, 0.35)
    font_size   = 14
    font_family = JetBrains Mono Nerd Font
    position    = 0, 88
    halign      = center
    valign      = bottom
}

# ──────────────────────────────────────────────────────
# WEATHER — bottom-left corner
# ──────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color       = rgba(255, 255, 255, 0.50)
    font_size   = 16
    font_family = JetBrains Mono Nerd Font
    position    = 48, 48
    halign      = left
    valign      = bottom
}

# ──────────────────────────────────────────────────────
# UPTIME — bottom-right corner
# ──────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo " $(uptime -p)"
    color       = rgba(255, 255, 255, 0.50)
    font_size   = 16
    font_family = JetBrains Mono Nerd Font
    position    = -48, 48
    halign      = right
    valign      = bottom
}
