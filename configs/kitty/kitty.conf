# ╔═══════════════════════════════════════════════════════════════════╗
# ║   Kitty Terminal — iOS Liquid Frosted Glass Config               ║
# ║   Caelestia + Hyprland | ghost@arch                              ║
# ╚═══════════════════════════════════════════════════════════════════╝

# ── Base Theme (Wallust colors override these) ────────────────────
include ./kitty-themes/00-CaelestiaGlass.conf
include ./kitty-themes/01-Wallust.conf
include ./kitty-themes/accent.conf

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  FONT                                                            ║
# ╚═══════════════════════════════════════════════════════════════════╝
font_family           JetBrainsMono Nerd Font
bold_font             auto
italic_font           auto
bold_italic_font      auto
font_size             11.5

# Ligatures
font_features JetBrainsMonoNFM-Regular   +liga +calt
font_features JetBrainsMonoNFM-Bold      +liga +calt
font_features JetBrainsMonoNFM-Italic    +liga +calt

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  FROSTED GLASS — TRANSPARENCY & BLUR                             ║
# ╚═══════════════════════════════════════════════════════════════════╝
background_opacity        0.72
background_blur           26
dynamic_background_opacity yes

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  CURSOR                                                          ║
# ╚═══════════════════════════════════════════════════════════════════╝
cursor_shape              block
cursor_blink_interval     0.5
cursor_stop_blinking_after 15
cursor_trail              1

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  SCROLLBACK                                                      ║
# ╚═══════════════════════════════════════════════════════════════════╝
scrollback_lines          5000
wheel_scroll_min_lines    1
wheel_scroll_multiplier   5.0

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  WINDOW                                                          ║
# ╚═══════════════════════════════════════════════════════════════════╝
window_padding_width      12
remember_window_size      no
initial_window_width      110c
initial_window_height     32c

# Draw borders (Hyprland handles window rounding/borders)
draw_minimal_borders      yes
window_margin_width       0

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  TAB BAR                                                         ║
# ╚═══════════════════════════════════════════════════════════════════╝
tab_bar_style             powerline
tab_bar_edge              bottom
tab_powerline_style       slanted
tab_bar_margin_height     0 0
tab_bar_background        #0d1018
tab_bar_margin_color      none

# Active tab — iOS blue accent
active_tab_foreground     #388bfd
active_tab_background     #1a2234
active_tab_font_style     bold

# Inactive tab — frosted glass muted
inactive_tab_foreground   #8b949e
inactive_tab_background   #0d1018
inactive_tab_font_style   normal

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  BELL & UX                                                       ║
# ╚═══════════════════════════════════════════════════════════════════╝
enable_audio_bell         no
visual_bell_duration      0
confirm_os_window_close   0

# Mouse
mouse_hide_wait           3.0
focus_follows_mouse       no
copy_on_select            clipboard

# URL handling
url_style                 curly
url_color                 #58a6ff
open_url_with             default
detect_urls               yes

# Linux display
linux_display_server      auto

# ╔═══════════════════════════════════════════════════════════════════╗
# ║  KEYBOARD SHORTCUTS                                              ║
# ╚═══════════════════════════════════════════════════════════════════╝
# Clear default maps first
clear_all_shortcuts       no

# Tabs
map ctrl+shift+t          new_tab_with_cwd
map ctrl+shift+w          close_tab
map ctrl+shift+Right      next_tab
map ctrl+shift+Left       previous_tab
map ctrl+shift+1          goto_tab 1
map ctrl+shift+2          goto_tab 2
map ctrl+shift+3          goto_tab 3
map ctrl+shift+4          goto_tab 4
map ctrl+shift+5          goto_tab 5

# Windows / Splits
map ctrl+shift+enter      new_window_with_cwd
map ctrl+shift+]          next_window
map ctrl+shift+[          previous_window
map ctrl+shift+f5         start_resizing_window

# Font size
map ctrl+equal            change_font_size all +1.0
map ctrl+minus            change_font_size all -1.0
map ctrl+0                change_font_size all 0

# Clipboard
map ctrl+shift+c          copy_to_clipboard
map ctrl+shift+v          paste_from_clipboard

# Scrollback
map ctrl+shift+k          scroll_line_up
map ctrl+shift+j          scroll_line_down
map ctrl+shift+Page_Up    scroll_page_up
map ctrl+shift+Page_Down  scroll_page_down
map ctrl+shift+Home       scroll_home
map ctrl+shift+End        scroll_end

# Opacity toggle (quick opaque mode)
map ctrl+shift+a>m        set_background_opacity +0.1
map ctrl+shift+a>l        set_background_opacity -0.1
map ctrl+shift+a>1        set_background_opacity 1
map ctrl+shift+a>d        set_background_opacity default

# Config reload
map ctrl+shift+F5         load_config_file